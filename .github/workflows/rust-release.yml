name: Rust Windows portable release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Existing release tag (vX.Y.Z)'
        required: true
        type: string
    secrets:
      RELEASE_REPOSITORIES_TOKEN:
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64 portable EXE
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out Rust launcher
        uses: actions/checkout@v6
        with:
          repository: hh-clicker/launcher-rust
          ref: ${{ inputs.tag }}
          token: ${{ secrets.RELEASE_REPOSITORIES_TOKEN || github.token }}
          path: launcher-rust
          persist-credentials: false

      - name: Check out Kotlin version reference
        uses: actions/checkout@v6
        with:
          repository: hh-clicker/launcher
          ref: ${{ inputs.tag }}
          token: ${{ secrets.RELEASE_REPOSITORIES_TOKEN || github.token }}
          path: launcher
          persist-credentials: false

      - name: Read and validate pinned inputs
        id: inputs
        run: |
          python launcher-rust/scripts/release-inputs.py --github-output $env:GITHUB_OUTPUT --launcher-properties launcher/gradle.properties
          if ($LASTEXITCODE -ne 0) { throw 'Invalid release inputs or product version' }
          $ErrorActionPreference = 'Stop'
          $rust = Get-Content -Raw -LiteralPath 'launcher-rust/release-inputs.json' | ConvertFrom-Json
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$' -or $env:RELEASE_TAG -ne "v$($rust.version)") {
            throw 'Release tag must match the Rust product version'
          }
          $release = Get-Content -Raw -LiteralPath "launcher/releases/$($rust.version)/release.json" | ConvertFrom-Json
          if ($release.version -ne $rust.version) { throw 'Release manifest version mismatch' }
          foreach ($name in @('backend', 'browser-agent', 'frontend', 'generation-agent', 'infra')) {
            if ($rust.repositories.$name.commit -cne $release.repositories.$name.commit) {
              throw "Rust and Kotlin service pins disagree: $name"
            }
          }

      - name: Check out backend
        uses: actions/checkout@v6
        with:
          repository: hh-clicker/backend
          ref: ${{ steps.inputs.outputs.backend }}
          token: ${{ secrets.RELEASE_REPOSITORIES_TOKEN || github.token }}
          path: backend
          persist-credentials: false

      - name: Check out Browser Agent
        uses: actions/checkout@v6
        with:
          repository: hh-clicker/browser-agent
          ref: ${{ steps.inputs.outputs.browser_agent }}
          token: ${{ secrets.RELEASE_REPOSITORIES_TOKEN || github.token }}
          path: browser-agent
          persist-credentials: false

      - name: Check out frontend
        uses: actions/checkout@v6
        with:
          repository: hh-clicker/frontend
          ref: ${{ steps.inputs.outputs.frontend }}
          token: ${{ secrets.RELEASE_REPOSITORIES_TOKEN || github.token }}
          path: frontend
          persist-credentials: false

      - name: Check out Generation Agent
        uses: actions/checkout@v6
        with:
          repository: hh-clicker/generation-agent
          ref: ${{ steps.inputs.outputs.generation_agent }}
          token: ${{ secrets.RELEASE_REPOSITORIES_TOKEN || github.token }}
          path: generation-agent
          persist-credentials: false

      - name: Check out infrastructure
        uses: actions/checkout@v6
        with:
          repository: hh-clicker/infra
          ref: ${{ steps.inputs.outputs.infra }}
          token: ${{ secrets.RELEASE_REPOSITORIES_TOKEN || github.token }}
          path: infra
          persist-credentials: false

      - name: Set up Node.js for TypeScript compilation
        uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'

      - name: Fetch verified local Rust toolchain and locked crates
        working-directory: launcher-rust
        run: |
          python scripts/bootstrap.py
          if ($LASTEXITCODE -ne 0) { throw 'Toolchain bootstrap failed' }
          . ./scripts/env.ps1
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw 'Cargo fetch failed' }

      - name: Stage pinned payload, test, build and verify EXE
        working-directory: launcher-rust
        run: ./scripts/build.ps1 -Test -Package -SourcesDir $env:GITHUB_WORKSPACE

      - name: Upload portable EXE to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-Item -LiteralPath "launcher-rust/dist/HH-Clicker-Rust-portable-$env:VERSION-win-x64.exe"
          $checksum = "$($exe.FullName).sha256"
          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText($checksum, "$hash  $($exe.Name)`n", [System.Text.Encoding]::ASCII)
          $isDraft = gh release view $env:RELEASE_TAG --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0 -or $isDraft.Trim() -ne 'true') {
            throw 'Assets can only be uploaded to an existing draft release'
          }
          gh release upload $env:RELEASE_TAG $exe.FullName $checksum --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload Rust release assets' }
